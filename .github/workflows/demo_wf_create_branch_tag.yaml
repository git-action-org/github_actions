name: demo-create-branch-tag
on:
  create:
    branches:
    - "*"
jobs: 
  branch-info:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
    - name: New-Branch-info 
      run: echo "New branch created ${{github.event.ref_type}},${{github.event.ref}}"

  tag-info:
    if: github.event.ref == 'tag'
    runs-on: ubuntu-latest
    steps: 
    - name: New-tag-info
      run: echo "New ${{github.evnet.ref_type}} is created-${{github.event.ref}}"

